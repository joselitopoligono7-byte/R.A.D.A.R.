<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Táctico AR</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --bg-color: #050b14;
            --primary-color: #00ff66;
            --secondary-color: #00bfff;
            --panel-bg: rgba(5, 11, 20, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            padding: 15px;
        }

        header {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .status-bar {
            font-size: 0.75rem;
            color: #88c0d0;
            margin-top: 3px;
        }

        /* Contenedor del Radar a pantalla completa */
        .ar-fullscreen-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: pointer;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        /* Botón discreto de Realidad Aumentada nativa */
        #ar-button {
            background: var(--secondary-color);
            color: #050b14;
            border-radius: 20px;
            border: none;
            position: absolute;
            top: 70px;
            right: 20px;
            padding: 8px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.75rem;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
            cursor: pointer;
            z-index: 10;
        }

        /* Panel HUD inferior flotante */
        .hud-panel {
            position: relative;
            width: 100%;
            max-width: 340px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 255, 102, 0.4);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            z-index: 10;
            backdrop-filter: blur(4px);
            margin-bottom: 10px;
            pointer-events: none;
        }

        #status-text {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary-color);
            transition: width 0.2s linear;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .pulse-text {
            animation: text-pulse 1s infinite alternate;
        }

        @keyframes text-pulse {
            from { opacity: 0.6; }
            to { opacity: 1; text-shadow: 0 0 10px var(--secondary-color); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Radar Táctico AR</h1>
        <div class="status-bar" id="system-state">SISTEMA EN ESPERA</div>
    </header>

    <!-- Visor 3D con forma de objeto tecnológico de prueba -->
    <div class="ar-fullscreen-container" id="radarTrigger">
        <model-viewer 
            id="radarModel"
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1">
            <button slot="ar-button" id="ar-button">
                📦 Ver en RA
            </button>
        </model-viewer>
    </div>

    <!-- Panel HUD inferior flotante -->
    <div class="hud-panel">
        <div id="status-text" class="pulse-text">Toca el radar para activar</div>
        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let timers = [];

        // Activar secuencia al tocar la pantalla
        document.getElementById('radarTrigger').addEventListener('click', function(e) {
            if (e.target.id === 'ar-button') return;
            startRadarSequence();
        });

        function startRadarSequence() {
            if (isRunning) return;
            isRunning = true;

            const statusText = document.getElementById('status-text');
            const systemState = document.getElementById('system-state');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');

            statusText.className = "pulse-text";
            statusText.style.color = "var(--secondary-color)";
            statusText.textContent = "Escaneando sector...";
            systemState.textContent = "ESTADO: ESCANEANDO";
            systemState.style.color = "var(--secondary-color)";
            
            progressContainer.style.display = "block";
            progressBar.style.width = "0%";
            progressBar.style.transition = "width 8s linear";
            setTimeout(() => { progressBar.style.width = "100%"; }, 50);

            timers.push(setTimeout(() => {
                statusText.className = "pulse-text loading-dots";
                statusText.style.color = "var(--primary-color)";
                statusText.textContent = "Detectando";
                systemState.textContent = "ESTADO: OBJETIVO LOCALIZADO";
            }, 3000));

            timers.push(setTimeout(() => {
                statusText.className = "pulse-text";
                statusText.style.color = "var(--secondary-color)";
                statusText.textContent = "Midiendo parámetros...";
                systemState.textContent = "ESTADO: ANÁLISIS ESPECTRAL";
            }, 5000));

            timers.push(setTimeout(() => {
                statusText.className = "pulse-text";
                statusText.style.color = "#ffcc00";
                statusText.textContent = "Enviando Datos...";
                systemState.textContent = "ESTADO: TRANSMISIÓN SEGURO";
            }, 8000));

            timers.push(setTimeout(() => {
                statusText.className = "";
                statusText.style.color = "var(--primary-color)";
                statusText.textContent = "¡Transmisión Completa! Toca para reiniciar.";
                systemState.textContent = "ESTADO: REPOSO";
                progressContainer.style.display = "none";
                progressBar.style.transition = "none";
                progressBar.style.width = "0%";
                isRunning = false;
            }, 10500));
        }
    </script>
</body>
</html>
