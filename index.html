<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Táctico AR - 3D</title>
    <!-- Importamos la librería oficial de Google para Realidad Aumentada -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --bg-color: #050b14;
            --primary-color: #00ff66;
            --secondary-color: #00bfff;
            --panel-bg: rgba(5, 11, 20, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding: 15px;
        }

        header {
            text-align: center;
            margin-top: 5px;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .status-bar {
            font-size: 0.75rem;
            color: #88c0d0;
            margin-top: 3px;
        }

        /* Contenedor del Visor 3D y RA */
        .ar-viewer-container {
            width: 100%;
            max-width: 340px;
            height: 280px;
            margin: 10px 0;
            position: relative;
            border: 2px solid rgba(0, 255, 102, 0.4);
            border-radius: 12px;
            background: radial-gradient(circle, #002211 0%, #050b14 90%);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        /* Botón personalizado de RA que activa Google AR */
        #ar-button {
            background: var(--secondary-color);
            color: #050b14;
            border-radius: 20px;
            border: none;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.85rem;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.5);
            cursor: pointer;
            z-index: 10;
        }

        /* Contenedor del Radar táctico original (para los textos y tiempos) */
        .radar-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 5px auto;
        }

        .radar-btn {
            position: relative;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #003311 0%, #050b14 80%);
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .radar-btn svg {
            width: 30px;
            height: 30px;
            fill: var(--primary-color);
        }

        .terminal-panel {
            width: 100%;
            max-width: 340px;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
            margin-bottom: 10px;
        }

        #status-text {
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        .progress-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary-color);
            transition: width 0.2s linear;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .pulse-text {
            animation: text-pulse 1s infinite alternate;
        }

        @keyframes text-pulse {
            from { opacity: 0.6; }
            to { opacity: 1; text-shadow: 0 0 10px var(--secondary-color); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Radar Táctico AR</h1>
        <div class="status-bar" id="system-state">SISTEMA EN ESPERA</div>
    </header>

    <!-- Visor 3D y Botón de Realidad Aumentada nativa -->
    <div class="ar-viewer-container">
        <model-viewer 
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            ar 
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1">
            <button slot="ar-button" id="ar-button">
                📦 Ver en tu espacio (AR)
            </button>
        </model-viewer>
    </div>

    <!-- Botón del Radar para activar la secuencia de textos -->
    <div class="radar-container" id="radarTrigger" onclick="startRadarSequence()">
        <div class="radar-btn">
            <svg viewBox="0 0 24 24">
                <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M12,6A6,6 0 0,0 6,12A6,6 0 0,0 12,18A6,6 0 0,0 18,12A6,6 0 0,0 12,6M12,8A4,4 0 0,1 16,12A4,4 0 0,1 12,16A4,4 0 0,1 8,12A4,4 0 0,1 12,8Z"/>
            </svg>
        </div>
    </div>

    <!-- Panel de Terminal con los Mensajes y Tiempos -->
    <div class="terminal-panel">
        <div id="status-text">Toca el radar para calibrar</div>
        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let timers = [];

        function startRadarSequence() {
            if (isRunning) return;
            isRunning = true;

            const statusText = document.getElementById('status-text');
            const systemState = document.getElementById('system-state');
            const progressBar = document.getElementById('progressBar');
            const progressContainer = document.getElementById('progressContainer');

            systemState.textContent = "ESTADO: ESCANEANDO";
            systemState.style.color = "var(--secondary-color)";
            progressContainer.style.display = "block";
            progressBar.style.width = "0%";
            
            progressBar.style.transition = "width 8s linear";
            setTimeout(() => { progressBar.style.width = "100%"; }, 50);

            timers.push(setTimeout(() => {
                statusText.className = "pulse-text loading-dots";
                statusText.style.color = "var(--primary-color)";
                statusText.textContent = "Detectando";
                systemState.textContent = "ESTADO: OBJETIVO LOCALIZADO";
            }, 3000));

            timers.push(setTimeout(() => {
                statusText.className = "pulse-text";
                statusText.style.color = "var(--secondary-color)";
                statusText.textContent = "Midiendo parámetros...";
                systemState.textContent = "ESTADO: ANÁLISIS ESPECTRAL";
            }, 5000));

            timers.push(setTimeout(() => {
                statusText.style.color = "#ffcc00";
                statusText.textContent = "Enviando Datos...";
                systemState.textContent = "ESTADO: TRANSMISIÓN SEGURO";
            }, 8000));

            timers.push(setTimeout(() => {
                statusText.className = "";
                statusText.style.color = "var(--primary-color)";
                statusText.textContent = "¡Transmisión Completa!";
                systemState.textContent = "ESTADO: REPOSO";
                progressContainer.style.display = "none";
                progressBar.style.transition = "none";
                progressBar.style.width = "0%";
                isRunning = false;
            }, 10500));
        }
    </script>
</body>
</html>
